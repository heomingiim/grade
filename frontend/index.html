<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 성적 관리 시스템</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>학생 성적 관리 시스템</h1>
  </header>

  <main>

    <!-- 학생 등록 폼 -->
    <section class="card">
      <h2>학생 등록</h2>
      <form id="studentForm">
        <input type="text" id="name"       placeholder="이름" maxlength="50" required />
        <!-- pattern="[0-9]+"으로 숫자만, maxlength로 글자수 제한, inputmode로 모바일 숫자키패드 -->
        <input type="text" id="student_no" placeholder="학번 (숫자만, 최대 20자)"
               pattern="[0-9]+" maxlength="20" inputmode="numeric" required />
        <button type="submit">등록</button>
      </form>
      <p id="studentMsg" class="msg"></p>
    </section>

    <!-- 성적 입력 폼 -->
    <section class="card">
      <h2>성적 입력</h2>
      <form id="scoreForm">
        <!-- 학생 목록은 JS에서 동적으로 채워준다 -->
        <select id="scoreStudentId" required>
          <option value="">학생 선택</option>
        </select>
        <input type="text"   id="subject" placeholder="과목명" maxlength="50" required />
        <input type="number" id="score"   placeholder="점수 (0~100)" min="0" max="100" step="1" required />
        <button type="submit">입력</button>
      </form>
      <p id="scoreMsg" class="msg"></p>
    </section>

    <!-- 학생 목록 + 평균/등급 조회 -->
    <section class="card">
      <div class="section-header">
        <h2>학생 목록</h2>
        <button id="refreshBtn">새로고침</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>학번</th>
            <th>과목 수</th>
            <th>평균</th>
            <th>등급</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- JS로 동적 생성 -->
        </tbody>
      </table>
    </section>

    <!-- 선택한 학생의 과목별 성적 상세 -->
    <section class="card" id="scoreDetail" style="display:none;">
      <h2 id="scoreDetailTitle">성적 상세</h2>
      <table>
        <thead>
          <tr>
            <th>과목</th>
            <th>점수</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="scoreTableBody">
          <!-- JS로 동적 생성 -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
