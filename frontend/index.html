<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 성적 관리 시스템</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>학생 성적 관리 시스템</h1>
  </header>

  <main>

    <!-- 대시보드 -->
    <section class="dashboard">
      <div class="dash-card">
        <p class="dash-label">전체 학생</p>
        <p class="dash-value" id="dash-total">-</p>
        <p class="dash-sub">명</p>
      </div>
      <div class="dash-card">
        <p class="dash-label">성적 입력 완료</p>
        <p class="dash-value" id="dash-entered">-</p>
        <p class="dash-sub">명</p>
      </div>
      <div class="dash-card">
        <p class="dash-label">전체 평균</p>
        <p class="dash-value" id="dash-avg">-</p>
        <p class="dash-sub">점</p>
      </div>
    </section>

    <!-- 학생 등록 폼 -->
    <section class="card">
      <h2>학생 등록</h2>
      <form id="studentForm">
        <input type="text" id="name"       placeholder="이름" maxlength="50" required />
        <input type="text" id="student_no" placeholder="학번 (숫자만, 최대 20자)"
               pattern="[0-9]+" maxlength="20" inputmode="numeric" required />
        <button type="submit">등록</button>
      </form>
      <p id="studentMsg" class="msg"></p>
    </section>

    <!-- 성적 입력 폼 -->
    <section class="card">
      <h2>성적 입력</h2>
      <form id="scoreForm">
        <select id="scoreStudentId" required>
          <option value="">학생 선택</option>
        </select>
        <input type="text"   id="subject" placeholder="과목명" maxlength="50" required />
        <input type="number" id="score"   placeholder="점수 (0~100)" min="0" max="100" step="1" required />
        <button type="submit">입력</button>
      </form>
      <p id="scoreMsg" class="msg"></p>
    </section>

    <!-- 학생 목록 -->
    <section class="card">
      <div class="section-header">
        <h2>학생 목록</h2>
        <button id="refreshBtn">새로고침</button>
      </div>

      <!-- 검색창 -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="이름 또는 학번으로 검색..." />
      </div>

      <table>
        <thead>
          <tr>
            <!-- 컬럼 헤더 클릭으로 정렬 -->
            <th class="sortable" onclick="setSort('name')">이름 <span id="sort-name"></span></th>
            <th>학번</th>
            <th>과목 수</th>
            <th class="sortable" onclick="setSort('avg_score')">평균 <span id="sort-avg_score"></span></th>
            <th class="sortable" onclick="setSort('grade')">등급 <span id="sort-grade"></span></th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
